name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Structure and Build
        run: |
          echo "Mengecek isi file..."
          ls -la
          
          # Jika file build.gradle tidak ada di root, tapi ada di dalam folder tersembunyi, pindahkan
          if [ ! -f "build.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "Struktur sudah pas di root."
          elif [ -d "WaifuProject" ]; then
            echo "Memindahkan file dari folder WaifuProject..."
            mv WaifuProject/* .
          fi

          ls -la
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
