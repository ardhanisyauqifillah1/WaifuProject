name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build APK
        run: |
          echo "Mencari lokasi project..."
          find . -name "build.gradle"
          
          # Cari folder yang punya build.gradle di dalam app, lalu build dari sana
          APP_DIR=$(find . -path "*/app/build.gradle" -exec dirname {} \;)
          if [ -n "$APP_DIR" ]; then
            PROJECT_ROOT=$(dirname "$APP_DIR")
            echo "Project ditemukan di: $PROJECT_ROOT"
            cd "$PROJECT_ROOT"
            gradle assembleDebug
          else
            echo "Mencoba build langsung..."
            gradle assembleDebug
          fi

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: **/app/build/outputs/apk/debug/app-debug.apk
          
